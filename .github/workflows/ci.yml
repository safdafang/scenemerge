name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly long fuzzing run (Monday 04:00 UTC).
    - cron: "0 4 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Keep fixtures byte-exact on Windows (they are also marked -text in .gitattributes).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # git identity for the end-to-end git tests
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Seed corpus from fixtures
        run: mkdir -p fuzz/corpus/parse && cp tests/fixtures/*/*.t* fuzz/corpus/parse/
      - name: Fuzz the parser (2 min on push, 10 min on schedule)
        run: cargo fuzz run parse -- -max_total_time=${{ github.event_name == 'schedule' && 600 || 120 }} -max_len=65536
      - name: Fuzz model building + diff
        run: cargo fuzz run model -- -max_total_time=${{ github.event_name == 'schedule' && 600 || 60 }} -max_len=65536

  msrv:
    name: MSRV build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --lib --bins --locked
