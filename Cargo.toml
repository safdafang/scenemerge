[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/godot-text",
    "crates/scene-model",
    "crates/scene-diff",
    "crates/scene-merge",
    "crates/scenemerge-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/OWNER/scenemerge"
homepage = "https://github.com/OWNER/scenemerge"
authors = ["scenemerge contributors"]
keywords = ["godot", "git", "merge", "diff", "gamedev"]
categories = ["command-line-utilities", "development-tools", "game-development"]

[workspace.dependencies]
godot-text = { path = "crates/godot-text", version = "0.1.0" }
scene-model = { path = "crates/scene-model", version = "0.1.0" }
scene-diff = { path = "crates/scene-diff", version = "0.1.0" }
scene-merge = { path = "crates/scene-merge", version = "0.1.0" }

thiserror = "2"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anstream = "0.6"
anstyle = "1"
insta = { version = "1.40", features = ["json"] }
proptest = "1.5"
criterion = { version = "0.5", default-features = false }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
