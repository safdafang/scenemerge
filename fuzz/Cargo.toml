[package]
name = "scenemerge-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
godot-text = { path = "../crates/godot-text" }

# Keep the fuzz crate out of the main workspace (it needs nightly).
[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
